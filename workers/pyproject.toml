[project]
name = "workers"
version = "0.1.0"
description = "Ingest worker and local vehicle simulator for the AV Cloud Platform"
requires-python = ">=3.13"
dependencies = [
    "avdata",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
avdata = { workspace = true }
