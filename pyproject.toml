[tool.uv.workspace]
members = ["avdata", "api"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint.isort]
known-first-party = ["avdata", "app"]

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.alembic]
script_location = "%(here)s/avdata/migrations"

[tool.pytest.ini_options]
testpaths = ["avdata/tests", "api/tests"]
