[project]
name = "api"
version = "0.1.0"
description = "FastAPI service for the AV Cloud Platform"
requires-python = ">=3.13"
dependencies = [
    "avdata",
    "fastapi>=0.162.2",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.uv.sources]
avdata = { workspace = true }
